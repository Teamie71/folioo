name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    name: Monorepo Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Check types
        id: types
        continue-on-error: true
        run: pnpm check-types

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Require all implemented checks to pass
        if: always()
        env:
          CHECK_RESULTS: >-
            ${{ steps.install.outcome }}
            ${{ steps.format.outcome }}
            ${{ steps.lint.outcome }}
            ${{ steps.types.outcome }}
            ${{ steps.build.outcome }}
        run: |
          read -r -a check_results <<< "$CHECK_RESULTS"
          if [ "${#check_results[@]}" -ne 5 ]; then
            echo 'CI results are incomplete. See the step logs.'
            exit 1
          fi
          for result in "${check_results[@]}"; do
            if [ "$result" != 'success' ]; then
              echo 'An implemented CI check failed or did not run. See the step logs.'
              exit 1
            fi
          done
