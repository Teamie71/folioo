name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'

jobs:
  plan:
    name: plan
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      bud: ${{ steps.plan.outputs.bud }}
      web: ${{ steps.plan.outputs.web }}
      ai: ${{ steps.plan.outputs.ai }}
      api: ${{ steps.plan.outputs.api }}
      skipped: ${{ steps.plan.outputs.skipped }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Plan affected parts
        id: plan
        run: node .github/scripts/plan-ci.mjs

  repo:
    name: repo
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

  bud:
    name: bud
    needs: plan
    if: ${{ needs.plan.outputs.bud == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-bud-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-bud-
            ${{ runner.os }}-turbo-

      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run check-types --filter='./packages/bud/*'

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run build --filter='./packages/bud/*'

  web:
    name: web
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-
            ${{ runner.os }}-turbo-

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @folioo/web lint

      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run check-types --filter=./apps/web

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run build --filter=./apps/web

  ai:
    name: ai
    needs: plan
    if: ${{ needs.plan.outputs.ai == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ci-dummy-key
      EXPMAP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/folioo_ai_test
      EXPMAP_REQUIRE_DB: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folioo_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup AI tools from mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.10.21'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-ai-${{ hashFiles('mise.toml', 'apps/ai/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-ai-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install AI dependencies
        id: install
        run: mise exec -- pnpm run ai:setup

      - name: Ruff lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise exec -- pnpm run ai:lint

      - name: Ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise exec -- pnpm run ai:format:check

      - name: AI tests with PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise exec -- pnpm run ai:test

  api:
    name: api
    needs: plan
    if: ${{ needs.plan.outputs.api == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/server/pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run format:check

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test

  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() }}
    needs: [plan, repo, bud, web, ai, api]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.plan.outputs.skipped }}
