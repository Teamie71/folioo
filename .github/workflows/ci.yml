name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'

jobs:
  plan:
    name: plan
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      bud: ${{ steps.plan.outputs.bud }}
      web: ${{ steps.plan.outputs.web }}
      skipped: ${{ steps.plan.outputs.skipped }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Plan affected parts
        id: plan
        run: node .github/scripts/plan-ci.mjs

  repo:
    name: repo
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

  bud:
    name: bud
    needs: plan
    if: ${{ needs.plan.outputs.bud == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-bud-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-bud-
            ${{ runner.os }}-turbo-

      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run check-types --filter='./packages/bud/*'

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run build --filter='./packages/bud/*'

  web:
    name: web
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-web-
            ${{ runner.os }}-turbo-

      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run check-types --filter=./apps/web

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run build --filter=./apps/web

  ci-ok:
    name: ci-ok
    if: ${{ !cancelled() }}
    needs: [plan, repo, bud, web]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.plan.outputs.skipped }}
