name: Task
description: Feature, Refactor, Chore, Docs
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: 어떤 문제를 해결하거나 무엇을 개선하나요?
      placeholder: 검색 결과가 없을 때 안내 화면을 표시합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업이 완료됐다고 판단할 수 있는 조건을 적어 주세요.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 참고 사항
      description: 작업 범위, 제외 범위, 관련 디자인·문서, 의존 작업을 적어 주세요.
